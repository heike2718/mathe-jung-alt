version: '2'
networks:
  mja-network:
services:
  latex-service-api:
    image: heike2718/latex-service-api
    container_name: latex-service-api
    ports:
      - 9200:8080
    environment:
      - TZ=Europe/Berlin
      - JAVA_OPTS=-Xmx1024m
    restart: on-failure:3
    volumes:
      - /home/heike/docker-volumes/latex/doc:/doc
    networks:
      - mja-network
    command: ["java","-jar","/opt/latex-client.jar"]
